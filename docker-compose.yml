version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventbyte-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nix}
      POSTGRES_DB: ${DB_NAME:-app_db}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventbyte-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventbyte-backend
    restart: always
    environment:
      - DATABASE_URL=postgres://${DB_USER:-app_user}:${DB_PASSWORD:-nix}@postgres:5432/${DB_NAME:-app_db}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-your-secret-key}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - USE_SQLITE=${USE_SQLITE:-False}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/app/data/db.sqlite3}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
